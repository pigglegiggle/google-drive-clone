<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="40.4" font-size="24" text-anchor="middle">Resumable upload — from file to published version</text><rect x="30" y="110" width="240" height="85" fill="white" stroke="#222"/><text x="150.0" y="146.45" font-size="17" text-anchor="middle">Browser hashes file</text><text x="150.0" y="170.45" font-size="17" text-anchor="middle">SHA-256 in a worker</text><rect x="330" y="110" width="240" height="85" fill="white" stroke="#222"/><text x="450.0" y="146.45" font-size="17" text-anchor="middle">Reserve quota</text><text x="450.0" y="170.45" font-size="17" text-anchor="middle">Persist upload session</text><rect x="630" y="110" width="240" height="85" fill="white" stroke="#222"/><text x="750.0" y="146.45" font-size="17" text-anchor="middle">Upload 8 MiB parts</text><text x="750.0" y="170.45" font-size="17" text-anchor="middle">Hash + S3 + saved ETag</text><rect x="930" y="110" width="240" height="85" fill="white" stroke="#222"/><text x="1050.0" y="146.45" font-size="17" text-anchor="middle">Complete + verify</text><text x="1050.0" y="170.45" font-size="17" text-anchor="middle">Check whole-file SHA-256</text><polyline points="270,152 330,152" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="570,152 630,152" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="870,152 930,152" fill="none" stroke="#222" marker-end="url(#arrow)"/><rect x="330" y="290" width="240" height="80" fill="white" stroke="#222"/><text x="450.0" y="323.95" font-size="17" text-anchor="middle">Resume original file</text><text x="450.0" y="347.95" font-size="17" text-anchor="middle">Skip confirmed parts</text><rect x="930" y="290" width="240" height="80" fill="white" stroke="#222"/><text x="1050.0" y="323.95" font-size="17" text-anchor="middle">Publish metadata</text><text x="1050.0" y="347.95" font-size="17" text-anchor="middle">One file version + object</text><polyline points="450,195 450,290" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="570,330 750,330 750,195" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="1050,195 1050,290" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="600.0" y="410.95" font-size="17" text-anchor="middle">Repeated completion returns the same file; a checksum mismatch never publishes a version.</text></g></svg>
